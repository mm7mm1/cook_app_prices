# Copied to .github/workflows/ of mm7mm1/cook_app_prices by tools/prices/publish.py.
name: Refresh prices
on:
  schedule:
    # Mondays 03:00 UTC (05:00-06:00 Kyiv), before people plan the week.
    - cron: "0 3 * * 1"
  workflow_dispatch:
permissions:
  contents: write
concurrency: refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/prices/refresh.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices/prices.json
          git diff --cached --quiet || git commit -m "Refresh prices"
          git push
